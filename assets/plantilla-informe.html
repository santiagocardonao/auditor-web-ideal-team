<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Auditoría web · {{sitio}} · {{periodo}}</title>
<style>
  @page { size: A4; margin: 16mm 14mm; }
  :root { --tinta:#1b1d22; --suave:#5b616e; --linea:#e3e5ea; --fondo:#f6f7f9;
          --verde:#1f8a4c; --amarillo:#b7791f; --rojo:#c0392b; --gris:#8a8f99; --acento:#2b4cbf; }
  * { box-sizing: border-box; }
  body { font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; color: var(--tinta);
         font-size: 10.5pt; line-height: 1.45; margin: 0; background: #fff; }
  h1 { font-size: 22pt; margin: 0 0 4px; letter-spacing: -0.01em; }
  h2 { font-size: 13.5pt; margin: 26px 0 10px; padding-bottom: 6px; border-bottom: 2px solid var(--tinta); }
  h3 { font-size: 11pt; margin: 16px 0 6px; }
  .meta { color: var(--suave); font-size: 9.5pt; }
  .portada { display: flex; justify-content: space-between; align-items: flex-start; gap: 20px;
             border-bottom: 1px solid var(--linea); padding-bottom: 14px; }
  .portada img { max-height: 48px; }
  .resumen { background: var(--fondo); border-left: 4px solid var(--acento); padding: 12px 14px; margin: 16px 0; }
  .tarjetas { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .tarjeta { border: 1px solid var(--linea); border-radius: 6px; padding: 8px 10px; break-inside: avoid; }
  .tarjeta .n { font-size: 18pt; font-weight: 700; }
  .tarjeta .a { font-size: 8.5pt; color: var(--suave); text-transform: uppercase; letter-spacing: .04em; }
  .verde .n { color: var(--verde); } .amarillo .n { color: var(--amarillo); }
  .rojo .n { color: var(--rojo); } .gris .n { color: var(--gris); }
  .prioridad { border: 1px solid var(--linea); border-radius: 6px; padding: 10px 12px; margin-bottom: 8px; break-inside: avoid; }
  .prioridad .t { font-weight: 650; }
  .sev { display: inline-block; font-size: 8pt; font-weight: 700; text-transform: uppercase; padding: 1px 6px;
         border-radius: 3px; color: #fff; margin-right: 6px; vertical-align: 1px; }
  .sev-critica { background: var(--rojo); } .sev-alta { background: #d35400; }
  .sev-media { background: var(--amarillo); } .sev-baja { background: var(--gris); }
  .det { color: var(--suave); font-size: 9.5pt; margin-top: 3px; }
  .det b { color: var(--tinta); font-weight: 600; }
  table { width: 100%; border-collapse: collapse; font-size: 9pt; margin-bottom: 10px; }
  th { text-align: left; background: var(--fondo); font-weight: 600; }
  th, td { border-bottom: 1px solid var(--linea); padding: 5px 6px; vertical-align: top; }
  tr { break-inside: avoid; }
  td.ev { word-break: break-all; color: var(--suave); }
  .up { color: var(--verde); font-weight: 600; } .down { color: var(--rojo); font-weight: 600; }
  .aviso { margin-top: 26px; font-size: 9pt; color: var(--suave); border-top: 1px solid var(--linea); padding-top: 8px; }
  ul { padding-left: 18px; margin: 6px 0; } li { margin-bottom: 4px; }
</style>
</head>
<body>
{{contenido}}
</body>
</html>
